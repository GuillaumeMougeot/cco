[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cco"
version = "0.1.0"
description = "Claude Code orchestrator for tmux: track sessions, switch accounts, restore after reboot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillaume Mougeot" }]
dependencies = ["typer>=0.12"]

[project.urls]
Repository = "https://github.com/GuillaumeMougeot/cco"

[project.scripts]
cco = "cco.cli:entrypoint"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/cco"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
